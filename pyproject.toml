[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autofix-pro"
version = "0.1.0"
description = "Sistema de gestion de ordenes de servicio del taller AutoFix Pro (PIA, Equipo 6)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "fpdf2>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    # Zonas horarias para zoneinfo: Windows no las trae. Sin tope porque su version sigue el anio.
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_referencia"]

[tool.ruff.lint]
# Reglas fijadas a proposito: desde Ruff 0.16 el conjunto por defecto es mucho mas grande,
# asi que sin esta lista el resultado cambia segun la version que instale cada integrante.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "api"]
