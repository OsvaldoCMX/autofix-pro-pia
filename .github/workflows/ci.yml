name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autofix
          POSTGRES_PASSWORD: solo-para-el-ci
          POSTGRES_DB: autofix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autofix -d autofix"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pruebas con cobertura (mínimo 80 %)
        env:
          APP_ENV: pruebas
          DATABASE_URL: postgresql+psycopg://autofix:solo-para-el-ci@localhost:5432/autofix
        run: >-
          pytest
          --cov=src
          --cov-branch
          --cov-report=term-missing
          --cov-report=html
          --cov-report=xml
          --cov-fail-under=80

      - name: Publicar cobertura y reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-y-reportes
          path: |
            htmlcov/
            coverage.xml
            reportes/
